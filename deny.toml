# cargo-deny policy. Complements (does not replace) the existing
# `cargo audit` + CycloneDX/OSV-Scanner pipeline in
# .github/workflows/test.yml and release.yml — cargo-deny additionally
# enforces license policy and bans duplicate/known-bad crate versions at
# build time, which OSV/audit alone don't cover.
#
# Run locally: cargo install cargo-deny && cargo deny check

[graph]
targets = []

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # id = "RUSTSEC-0000-0000" # reason, exception-expiry, linked tracking issue
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # { name = "openssl", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
