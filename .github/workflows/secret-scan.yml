name: Secret Scanning

# Resolves: #484 (security scanning in CI/CD)
#
# Detects secrets, API keys, tokens, and credentials accidentally committed
# to the repository using two complementary tools:
#
#   • Gitleaks  — fast regex/entropy scanner covering the full git history
#   • TruffleHog — deep entropy + verified-secret scanning with provider plugins
#
# Findings are uploaded to GitHub's Security → Code scanning dashboard (SARIF).
# The job fails on any detected unverified or verified secret.

permissions: {}

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Daily at 03:30 UTC — catches newly created pattern rules
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  # ── Gitleaks ──────────────────────────────────────────────────────────────
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository (full history for history scan)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # optional for org plans
        continue-on-error: true

      - name: Run Gitleaks (SARIF output)
        run: |
          # Install gitleaks
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks

          # Scan — generate both JSON and SARIF
          gitleaks detect \
            --source . \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --redact \
            --log-opts="--all" \
            || echo "GITLEAKS_EXIT=$?" >> "$GITHUB_ENV"

          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0 \
            --redact \
            --log-opts="--all" \
            || true

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
        continue-on-error: true

      - name: Upload Gitleaks JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 90

      - name: Fail if secrets detected
        if: env.GITLEAKS_EXIT != '' && env.GITLEAKS_EXIT != '0'
        run: |
          echo "❌ Gitleaks detected secrets in the repository. Review gitleaks-report.json."
          exit 1

  # ── TruffleHog ────────────────────────────────────────────────────────────
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --only-verified
            --json
            --no-update
        continue-on-error: true

      - name: Run TruffleHog (full scan with SARIF)
        run: |
          # Install TruffleHog
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin v3.82.13

          # Full filesystem scan
          trufflehog filesystem . \
            --json \
            --no-verification \
            2>/dev/null \
            | tee trufflehog-report.json || true

          # Count findings
          FINDINGS=$(wc -l < trufflehog-report.json 2>/dev/null || echo 0)
          echo "TruffleHog findings: $FINDINGS"

      - name: Convert TruffleHog JSON to SARIF
        run: |
          python3 - <<'PYEOF'
          import json, pathlib

          results = []
          report_file = pathlib.Path("trufflehog-report.json")
          if report_file.exists():
              for line in report_file.read_text().splitlines():
                  try:
                      finding = json.loads(line)
                      detector = finding.get("DetectorName", "TruffleHog")
                      verified = finding.get("Verified", False)
                      source = finding.get("SourceMetadata", {}).get("Data", {})
                      file_path = source.get("Filesystem", {}).get("file", "unknown")
                      results.append({
                          "ruleId": detector,
                          "level": "error" if verified else "warning",
                          "message": {"text": f"Potential secret detected by {detector} — verified={verified}"},
                          "locations": [{"physicalLocation": {"artifactLocation": {"uri": file_path}}}],
                      })
                  except json.JSONDecodeError:
                      continue

          sarif = {
              "version": "2.1.0",
              "$schema": "https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0-rtm.5.json",
              "runs": [{"tool": {"driver": {"name": "TruffleHog", "rules": []}}, "results": results}],
          }
          pathlib.Path("trufflehog.sarif").write_text(json.dumps(sarif, indent=2))
          print(f"Converted {len(results)} finding(s) to SARIF.")
          PYEOF

      - name: Upload TruffleHog SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trufflehog.sarif
          category: trufflehog
        continue-on-error: true

      - name: Upload TruffleHog JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 90

  # ── Gitleaks config (ensure it exists) ────────────────────────────────────
  ensure-gitleaks-config:
    name: Ensure .gitleaks.toml baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify .gitleaks.toml exists
        run: |
          if [ ! -f ".gitleaks.toml" ]; then
            echo "⚠️  .gitleaks.toml not found — using Gitleaks default ruleset."
            echo "Consider adding a .gitleaks.toml to customise allowlists for test fixtures."
          else
            echo "✅ .gitleaks.toml found."
            cat .gitleaks.toml
          fi

  # ── Policy gate ───────────────────────────────────────────────────────────
  secret-scan-gate:
    name: Secret scan policy gate
    runs-on: ubuntu-latest
    needs: [gitleaks, trufflehog]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate gate
        run: |
          GITLEAKS="${{ needs.gitleaks.result }}"
          TRUFFLEHOG="${{ needs.trufflehog.result }}"
          echo "Gitleaks:   $GITLEAKS"
          echo "TruffleHog: $TRUFFLEHOG"
          if [[ "$GITLEAKS" == "failure" || "$TRUFFLEHOG" == "failure" ]]; then
            echo "❌ Secret scanning gate failed — secrets detected in repository."
            exit 1
          fi
          echo "✅ No secrets detected."
