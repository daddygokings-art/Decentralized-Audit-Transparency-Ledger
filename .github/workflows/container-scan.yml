name: Container Vulnerability Scan

permissions: {}

on:
  push:
    paths:
      - "docker/**"
      - ".github/workflows/container-scan.yml"
  pull_request:
    paths:
      - "docker/**"
      - ".github/workflows/container-scan.yml"
  schedule:
    # Nightly — image base layers accrue new CVEs even with no code change.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  trivy:
    name: Trivy scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the code-scanning tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/Dockerfile.api
          - image: ui
            dockerfile: docker/Dockerfile.ui
          - image: contract
            dockerfile: docker/Dockerfile.contract
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} -t audit-ledger-${{ matrix.image }}:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: audit-ledger-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          # HIGH/CRITICAL gate the build; MEDIUM/LOW are reported, feeding
          # the SLA-based remediation process in
          # docs/security/vulnerability-management.md, not blocking CI.
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload SARIF (always, even on scan failure)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Upload full report (unfiltered severities) for triage
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/workspace" aquasec/trivy:latest image \
            --format json --output /workspace/trivy-${{ matrix.image }}-full.json \
            audit-ledger-${{ matrix.image }}:scan || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.image }}-report
          path: trivy-${{ matrix.image }}-full.json
          retention-days: 90
