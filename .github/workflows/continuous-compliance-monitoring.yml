name: Continuous Compliance Monitoring & Evidence Collection

on:
  schedule:
    - cron: '0 3 * * 1' # Weekly on Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  compliance-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Continuous Compliance Monitor
        run: |
          python3 scripts/compliance/continuous_compliance_monitor.py

      - name: Archive Compliance Reports
        uses: actions/upload-artifact@v4
        with:
          name: compliance-audit-reports
          path: reports/compliance/
