name: Contract Event Release Automation

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0 or v1.0.0-rc.1)'
        required: true
      is_prerelease:
        description: 'Is this a pre-release candidate?'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-and-build:
    name: Validate SemVer & Package Release Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Validate Semantic Versioning
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          ./scripts/release/semver-manager.sh parse "$VERSION"

      - name: Build Contract WASM
        run: |
          cargo build --target wasm32v1-none --release

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx || true
          mkdir -p sbom
          cargo cyclonedx --output sbom/audit-ledger-sbom.json || true

      - name: Package Release Assets
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          ./scripts/release/publish-assets.sh "$VERSION"

      - name: Generate Release Notes
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          ./scripts/release/generate-release-notes.sh "$VERSION"

      - name: Upload Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/release/*
            RELEASE_NOTES.md

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Dist Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Determine Pre-release Status
        id: release_meta
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          if [[ "$VERSION" == *"-"* ]] || [ "${{ github.event.inputs.is_prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: "Release ${{ steps.release_meta.outputs.tag }}"
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ steps.release_meta.outputs.prerelease == 'true' }}
          files: |
            dist/audit_ledger.wasm
            dist/contract-event-schema.json
            dist/SHA256SUMS
            dist/SHA512SUMS
            dist/manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
