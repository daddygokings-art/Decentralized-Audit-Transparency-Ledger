name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Soroban contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Run cargo-audit for dependency vulnerabilities
        run: cargo install cargo-audit && cargo audit --deny warnings

      - name: Generate SBOM with CycloneDX
        run: |
          cargo install cargo-cyclonedx
          mkdir -p sbom
          cargo cyclonedx --output sbom/audit-ledger-sbom.json

      - name: Scan SBOM for vulnerabilities with OSV
        run: |
          curl -sSfL https://raw.githubusercontent.com/google/osv.dev/v1.6.3/tools/osv-scanner/install.sh | bash -s -- -b /usr/local/bin
          osv-scanner --sbom sbom/audit-ledger-sbom.json --output osv-scan-report.txt || true
          cat osv-scan-report.txt

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-audit-ledger
          path: sbom/audit-ledger-sbom.json
          retention-days: 30

      - name: Upload OSV scan report
        uses: actions/upload-artifact@v4
        with:
          name: osv-scan-report
          path: osv-scan-report.txt
          retention-days: 30

  shellcheck:
    name: Shell syntax validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts

  wasm-size:
    name: WASM size regression check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add WASM target
        run: rustup target add wasm32v1-none

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release

      - name: Check WASM size
        run: |
          WASM_FILE="target/wasm32v1-none/release/audit_ledger.wasm"
          if [ ! -f "$WASM_FILE" ]; then
            echo "ERROR: WASM binary not found!"
            exit 1
          fi
          SIZE=$(stat --format=%s "$WASM_FILE")
          MAX_SIZE=$(( 128 * 1024 ))  # 128 KB
          echo "WASM size: $SIZE bytes"
          echo "Max allowed: $MAX_SIZE bytes (128 KB)"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "ERROR: WASM binary exceeds maximum allowed size of 128 KB"
            exit 1
          fi
          echo "WASM size check passed."
