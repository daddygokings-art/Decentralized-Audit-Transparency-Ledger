name: Container Security Scanning

# Resolves: #484 (security scanning in CI/CD)
#
# Comprehensive container image security scanning using:
#   • Trivy  — OS packages + application libraries (replaces/extends container-scan.yml)
#   • Grype  — second-opinion scanner with its own vulnerability DB
#   • Docker Scout — policy evaluation and supply-chain attestation
#   • Dockle   — CIS Docker Benchmark best-practice linting
#
# Findings are uploaded to GitHub Security → Code scanning (SARIF).
# The workflow gates on CRITICAL and HIGH severity findings.

permissions: {}

on:
  push:
    branches: [master, main]
    paths:
      - "docker/**"
      - "api/rest/Dockerfile"
      - "api/graphql/Dockerfile"
      - "ui/Dockerfile"
      - "bridge/relayer/Dockerfile"
      - "tools/metrics-exporter/Dockerfile"
      - ".github/workflows/container-security.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "docker/**"
      - "api/rest/Dockerfile"
      - "api/graphql/Dockerfile"
      - "ui/Dockerfile"
      - "bridge/relayer/Dockerfile"
      - "tools/metrics-exporter/Dockerfile"
      - ".github/workflows/container-security.yml"
  schedule:
    # Nightly — image base layers accrue new CVEs even with no code changes
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  # ── Trivy container scan ──────────────────────────────────────────────────
  trivy:
    name: Trivy — ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            context: .
          - name: ui
            dockerfile: docker/Dockerfile.ui
            context: .
          - name: contract
            dockerfile: docker/Dockerfile.contract
            context: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t audit-ledger-${{ matrix.name }}:${{ github.sha }} \
            --load \
            ${{ matrix.context }}

      - name: Run Trivy (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "audit-ledger-${{ matrix.name }}:${{ github.sha }}"
          format: sarif
          output: "trivy-${{ matrix.name }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # gate is handled by the policy-gate job
          ignore-unfixed: true

      - name: Run Trivy (table, full severity)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "audit-ledger-${{ matrix.name }}:${{ github.sha }}"
          format: table
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"
          ignore-unfixed: false

      - name: Run Trivy (JSON, full severity)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "audit-ledger-${{ matrix.name }}:${{ github.sha }}"
          format: json
          output: "trivy-${{ matrix.name }}-full.json"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          exit-code: "0"

      - name: Gate on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "audit-ledger-${{ matrix.name }}:${{ github.sha }}"
          format: table
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-${{ matrix.name }}.sarif"
          category: "trivy-container-${{ matrix.name }}"

      - name: Upload full report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "trivy-container-${{ matrix.name }}"
          path: "trivy-${{ matrix.name }}-full.json"
          retention-days: 90

  # ── Grype container scan ──────────────────────────────────────────────────
  grype:
    name: Grype — ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: ui
            dockerfile: docker/Dockerfile.ui
          - name: contract
            dockerfile: docker/Dockerfile.contract
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t audit-ledger-${{ matrix.name }}:scan \
            --load .

      - name: Run Grype
        uses: anchore/scan-action@v3
        id: grype
        with:
          image: "audit-ledger-${{ matrix.name }}:scan"
          output-format: sarif
          severity-cutoff: high
          fail-build: true
        continue-on-error: true

      - name: Upload Grype SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "${{ steps.grype.outputs.sarif }}"
          category: "grype-container-${{ matrix.name }}"
        continue-on-error: true

  # ── Dockle CIS benchmark linting ──────────────────────────────────────────
  dockle:
    name: Dockle CIS lint — ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: ui
            dockerfile: docker/Dockerfile.ui
          - name: contract
            dockerfile: docker/Dockerfile.contract
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t audit-ledger-${{ matrix.name }}:dockle \
            --load .

      - name: Install Dockle
        run: |
          VERSION=$(curl -s "https://api.github.com/repos/goodwithtech/dockle/releases/latest" \
            | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSfL \
            "https://github.com/goodwithtech/dockle/releases/download/v${VERSION}/dockle_${VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin dockle
          chmod +x /usr/local/bin/dockle

      - name: Run Dockle
        run: |
          dockle \
            --format json \
            --output dockle-${{ matrix.name }}.json \
            --exit-code 1 \
            --exit-level warn \
            audit-ledger-${{ matrix.name }}:dockle \
            || echo "DOCKLE_EXIT=$?" >> "$GITHUB_ENV"
          cat dockle-${{ matrix.name }}.json || true

      - name: Upload Dockle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dockle-${{ matrix.name }}
          path: dockle-${{ matrix.name }}.json
          retention-days: 90

  # ── Trivy config / IaC scan ───────────────────────────────────────────────
  trivy-config:
    name: Trivy IaC/config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload config scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ── Policy gate ───────────────────────────────────────────────────────────
  container-scan-gate:
    name: Container security gate
    runs-on: ubuntu-latest
    needs: [trivy, grype, dockle, trivy-config]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Evaluate gate
        run: |
          TRIVY="${{ needs.trivy.result }}"
          GRYPE="${{ needs.grype.result }}"
          DOCKLE="${{ needs.dockle.result }}"
          CONFIG="${{ needs.trivy-config.result }}"
          echo "Trivy:        $TRIVY"
          echo "Grype:        $GRYPE"
          echo "Dockle:       $DOCKLE"
          echo "Trivy Config: $CONFIG"
          if [[ "$TRIVY" == "failure" ]]; then
            echo "❌ Trivy found CRITICAL/HIGH vulnerabilities in container images."
            exit 1
          fi
          echo "✅ Container security gate passed."
