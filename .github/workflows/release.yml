name: Release

# Creates a GitHub Release with:
#   - audit_ledger.wasm       — production WASM binary (hermetic build)
#   - wasm-checksums.txt      — SHA-256 checksum
#   - audit-ledger-sbom.json  — CycloneDX SBOM
#   - audit_ledger.wasm.bundle       — Sigstore cosign signature bundle
#   - audit-ledger-sbom.json.bundle  — Sigstore cosign SBOM signature bundle
#   - checksums.txt.bundle    — Sigstore cosign checksums signature bundle
#   - audit_ledger.wasm.intoto.jsonl — SLSA Level 3 provenance attestation
#
# Supply chain security (SLSA Level 3):
#   - All builds are hermetic: pinned Rust 1.85.0, --locked --frozen
#   - Provenance is non-forgeable (generated by slsa-github-generator, not
#     repository code)
#   - Artifacts are signed with Sigstore keyless OIDC (no long-lived keys)
#   - Signatures are stored in Sigstore Rekor transparency log
#
# Issue #504 — SLSA Level 3 supply chain security

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  # ── 1. Build, test, and produce all release artifacts ─────────────────────
  build-and-test:
    name: Build, test, and sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write   # for Sigstore keyless signing

    outputs:
      artifact-digest: ${{ steps.digest.outputs.artifact-digest }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout source
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── Harden runner ────────────────────────────────────────────────────
      - name: Harden runner
        # step-security/harden-runner v2.10.4
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.10.4
        with:
          egress-policy: audit
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            static.rust-lang.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      # ── Rust toolchain ─────────────────────────────────────────────────
      - name: Install Rust 1.85.0 (pinned)
        uses: dtolnay/rust-toolchain@c758e63728211bd4cbe26fa022e60290dd5c2e3c # 1.85.0
        with:
          toolchain: "1.85.0"
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: release-cargo-${{ runner.os }}-1.85.0-${{ hashFiles('Cargo.lock') }}

      # ── Quality gates ────────────────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

      - name: Dependency policy (cargo-deny)
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      # ── Hermetic WASM build ───────────────────────────────────────────────
      - name: Build WASM (hermetic, reproducible)
        env:
          SOURCE_DATE_EPOCH: "0"
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: ""
        run: |
          cargo clean
          cargo build \
            --target wasm32v1-none \
            --release \
            --locked \
            --frozen

          WASM="target/wasm32v1-none/release/audit_ledger.wasm"
          cp "$WASM" ./audit_ledger.wasm
          echo "WASM size: $(stat --format='%s' audit_ledger.wasm) bytes"

      - name: Assert WASM ≤ 128 KB
        run: |
          SIZE=$(stat --format='%s' audit_ledger.wasm)
          MAX=$((128 * 1024))
          echo "WASM size: ${SIZE} bytes / max: ${MAX} bytes"
          [ "$SIZE" -le "$MAX" ] || (echo "ERROR: exceeds 128 KB" && exit 1)

      # ── Generate SBOM ─────────────────────────────────────────────────────
      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          mkdir -p sbom
          cargo cyclonedx --output sbom/audit-ledger-sbom.json

      # ── Compute checksums ─────────────────────────────────────────────────
      - name: Compute checksums
        id: digest
        run: |
          WASM_SHA=$(sha256sum audit_ledger.wasm | cut -d' ' -f1)
          SBOM_SHA=$(sha256sum sbom/audit-ledger-sbom.json | cut -d' ' -f1)

          echo "${WASM_SHA}  audit_ledger.wasm"         > wasm-checksums.txt
          echo "${SBOM_SHA}  audit-ledger-sbom.json"   >> wasm-checksums.txt
          cat wasm-checksums.txt

          # Base64-encoded digest for SLSA provenance
          WASM_B64=$(echo -n "sha256:${WASM_SHA}" | base64 -w 0)
          echo "artifact-digest=${WASM_B64}" >> "$GITHUB_OUTPUT"

      # ── Sign artifacts with Sigstore cosign ───────────────────────────────
      - name: Install cosign
        # sigstore/cosign-installer v3.8.1
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: "v2.4.3"

      - name: Sign WASM artifact
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle audit_ledger.wasm.bundle \
            audit_ledger.wasm
          echo "✓ WASM signed"

      - name: Sign SBOM
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle sbom/audit-ledger-sbom.json.bundle \
            sbom/audit-ledger-sbom.json
          echo "✓ SBOM signed"

      - name: Sign checksums
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign-blob \
            --bundle wasm-checksums.txt.bundle \
            wasm-checksums.txt
          echo "✓ checksums signed"

      # ── Self-verify signatures ────────────────────────────────────────────
      - name: Verify WASM signature
        run: |
          cosign verify-blob \
            --bundle audit_ledger.wasm.bundle \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            audit_ledger.wasm
          echo "✓ WASM signature verified"

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload release artifacts
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            audit_ledger.wasm
            audit_ledger.wasm.bundle
            wasm-checksums.txt
            wasm-checksums.txt.bundle
            sbom/audit-ledger-sbom.json
            sbom/audit-ledger-sbom.json.bundle
          retention-days: 30
          if-no-files-found: error

  # ── 2. SLSA Level 3 provenance ────────────────────────────────────────────
  # Run by slsa-github-generator in an isolated job — NOT by this repo's code.
  # This is what provides the non-forgeable provenance guarantee.
  slsa-provenance:
    name: SLSA Level 3 provenance
    needs: [build-and-test]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build-and-test.outputs.artifact-digest }}
      upload-assets: true
      provenance-name: audit_ledger.wasm.intoto.jsonl

  # ── 3. Generate changelog ─────────────────────────────────────────────────
  generate-changelog:
    name: Generate changelog
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    permissions:
      contents: read
    outputs:
      release_notes: ${{ steps.cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  # ── 4. Create GitHub Release ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-and-test, slsa-provenance, generate-changelog]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # ── Download all artifacts ────────────────────────────────────────────
      - name: Download release artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-artifacts
          path: artifacts/

      - name: Download SLSA provenance
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: audit_ledger.wasm.intoto.jsonl
          path: artifacts/
        # Provenance may not exist on pre-release builds — don't hard-fail
        continue-on-error: true

      - name: Download release notes
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: release-notes
          path: artifacts/

      # ── Determine release flags ───────────────────────────────────────────
      - name: Determine pre-release flag
        id: flags
        run: |
          TAG="${{ github.ref_name }}"
          [[ "$TAG" == *"-"* ]] && echo "prerelease=true" || echo "prerelease=false" \
            >> "$GITHUB_OUTPUT"

      # ── Append SLSA + Sigstore info to release notes ──────────────────────
      - name: Append supply chain security info to release notes
        run: |
          WASM_SHA=$(grep 'audit_ledger.wasm' artifacts/wasm-checksums.txt | cut -d' ' -f1 || echo "see wasm-checksums.txt")

          cat >> artifacts/RELEASE_NOTES.md << 'ENDOFNOTES'

          ---

          ## 🔐 Supply Chain Security (SLSA Level 3)

          This release was built with full SLSA Level 3 supply chain protections.

          ### Artifacts included

          | File | Description |
          |------|-------------|
          | `audit_ledger.wasm` | Production WASM binary |
          | `wasm-checksums.txt` | SHA-256 checksums |
          | `audit-ledger-sbom.json` | CycloneDX Software Bill of Materials |
          | `audit_ledger.wasm.bundle` | Sigstore cosign signature bundle |
          | `audit-ledger-sbom.json.bundle` | Sigstore cosign SBOM signature bundle |
          | `wasm-checksums.txt.bundle` | Sigstore cosign checksums bundle |
          | `audit_ledger.wasm.intoto.jsonl` | SLSA Level 3 provenance attestation |

          ### Verify the WASM binary

          ```bash
          # 1. Install cosign and slsa-verifier (see docs/slsa.md)
          # 2. Run the auditor verification script:
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/verify-artifact.sh \
            | bash -s -- \
                --wasm      audit_ledger.wasm \
                --bundle    audit_ledger.wasm.bundle \
                --provenance audit_ledger.wasm.intoto.jsonl \
                --source    github.com/${{ github.repository }} \
                --tag       ${{ github.ref_name }}
          ```

          See [`docs/slsa.md`](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/slsa.md) for full verification instructions.

          ### Build integrity

          - Rust toolchain: `1.85.0` (pinned)
          - Build flags: `--locked --frozen --release`
          - `SOURCE_DATE_EPOCH=0` (deterministic timestamps)
          - `CARGO_INCREMENTAL=0` (no incremental cache)
          - Provenance generated by [slsa-framework/slsa-github-generator](https://github.com/slsa-framework/slsa-github-generator) v2.1.0 (isolated, non-forgeable)
          - Signed with [Sigstore](https://sigstore.dev) keyless OIDC (no long-lived keys)
          ENDOFNOTES

      # ── Create release ────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body_path: artifacts/RELEASE_NOTES.md
          prerelease: ${{ steps.flags.outputs.prerelease }}
          files: |
            artifacts/audit_ledger.wasm
            artifacts/audit_ledger.wasm.bundle
            artifacts/wasm-checksums.txt
            artifacts/wasm-checksums.txt.bundle
            artifacts/audit-ledger-sbom.json
            artifacts/audit-ledger-sbom.json.bundle
            artifacts/audit_ledger.wasm.intoto.jsonl
          generate_release_notes: false
          fail_on_unmatched_files: false   # provenance absent on pre-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Update CHANGELOG.md on main ────────────────────────────────────────
  update-changelog:
    name: Prepend to CHANGELOG.md
    runs-on: ubuntu-24.04
    needs: [create-release]
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGELOG_PAT || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --prepend CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit changelog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore(changelog): update for ${{ github.ref_name }} [skip ci]"
          git push origin main
