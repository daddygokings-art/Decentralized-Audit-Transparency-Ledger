name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"        # e.g. v1.2.3
      - "v[0-9]+.[0-9]+.[0-9]+-*"       # e.g. v1.2.3-rc.1

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  # ── 1. Build & test ────────────────────────────────────────────────────────
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history required for git-cliff
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32v1-none

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Security audit
        run: cargo install cargo-audit && cargo audit --deny warnings

      - name: Generate SBOM with CycloneDX
        run: |
          cargo install cargo-cyclonedx
          mkdir -p sbom
          cargo cyclonedx --output sbom/audit-ledger-sbom.json

      - name: Build WASM (release)
        run: cargo build --target wasm32v1-none --release

      - name: Assert WASM ≤ 128 KB
        run: |
          WASM=target/wasm32v1-none/release/audit_ledger.wasm
          SIZE=$(stat --format=%s "$WASM")
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt $((128 * 1024)) ]; then
            echo "ERROR: WASM exceeds 128 KB limit ($SIZE bytes)" && exit 1
          fi

      - name: Compute WASM checksums
        run: |
          sha256sum \
            target/wasm32v1-none/release/audit_ledger.wasm \
            > wasm-checksums.txt
          cat wasm-checksums.txt

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-release
          path: |
            target/wasm32v1-none/release/audit_ledger.wasm
            wasm-checksums.txt
          retention-days: 30

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-audit-ledger
          path: sbom/audit-ledger-sbom.json
          retention-days: 30

  # ── 2. Generate changelog ──────────────────────────────────────────────────
  generate-changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
    outputs:
      release_notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes with git-cliff
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 7

  # ── 3. Create GitHub Release ───────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-test, generate-changelog]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-release
          path: artifacts/wasm

      - name: Download release notes artifact
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: artifacts

      - name: Determine pre-release flag
        id: flags
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body_path: artifacts/RELEASE_NOTES.md
          prerelease: ${{ steps.flags.outputs.prerelease }}
          files: |
            artifacts/wasm/audit_ledger.wasm
            artifacts/wasm/wasm-checksums.txt
          generate_release_notes: false   # we supply our own notes via git-cliff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Update CHANGELOG.md on main ────────────────────────────────────────
  update-changelog:
    name: Prepend to CHANGELOG.md
    runs-on: ubuntu-latest
    needs: create-release
    # Only run on non-prerelease tags so release candidates don't pollute the log
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT or deploy key to push back to main; falls back to
          # GITHUB_TOKEN for repos where branch protection allows it.
          token: ${{ secrets.CHANGELOG_PAT || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --prepend CHANGELOG.md
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit updated CHANGELOG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet && echo "No changelog changes." && exit 0
          git commit -m "chore(changelog): update for ${{ github.ref_name }} [skip ci]"
          git push origin main
