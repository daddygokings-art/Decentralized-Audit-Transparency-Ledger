name: Container Integration Tests

# Run on pushes to main/develop or any PR that touches the test
# infrastructure or Rust source files.
on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration-containers.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/integration-containers.yml"
  # Allow manual runs to re-run flaky container tests without a code push.
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional test name filter (e.g. postgres)"
        required: false
        default: ""

permissions:
  contents: read

# Cancel in-flight runs on the same branch so only the latest commit is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the Rust toolchain version for reproducibility.
  RUST_TOOLCHAIN: "1.88"
  # Increase the timeout for slow container startups in CI.
  TESTCONTAINERS_COMMAND_WAIT_TIMEOUT_SECONDS: "180"
  # Send log output from testcontainers to stderr so it appears in the run log.
  TESTCONTAINERS_RYUK_DISABLED: "false"
  RUST_LOG: "info,testcontainers=debug"
  RUST_BACKTRACE: "1"

jobs:
  # ── Build & syntax check ─────────────────────────────────────────────────────
  check:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo registry & build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (tests included)
        run: cargo clippy --tests -- -D warnings

      - name: cargo build (all targets)
        run: cargo build --tests

  # ── PostgreSQL integration tests ─────────────────────────────────────────────
  test-postgres:
    name: PostgreSQL tests
    runs-on: ubuntu-latest
    needs: check
    services:
      # Run Ryuk (testcontainers resource reaper) as a sidecar.
      ryuk:
        image: testcontainers/ryuk:0.11.0
        ports:
          - 8080
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
        env:
          RYUK_CONNECTION_TIMEOUT: "120s"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify Docker is available
        run: docker info

      - name: Run PostgreSQL integration tests
        run: |
          cargo test --test integration_containers postgres \
            -- --ignored --test-threads=4 \
            ${{ github.event.inputs.test_filter != '' && format('--test-filter {0}', github.event.inputs.test_filter) || '' }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-logs
          path: |
            target/tmp/
          retention-days: 7

  # ── Redis integration tests ───────────────────────────────────────────────────
  test-redis:
    name: Redis tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify Docker is available
        run: docker info

      - name: Run Redis integration tests
        run: |
          cargo test --test integration_containers redis \
            -- --ignored --test-threads=4

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: redis-test-logs
          path: target/tmp/
          retention-days: 7

  # ── Kafka integration tests ───────────────────────────────────────────────────
  test-kafka:
    name: Kafka tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libssl-dev pkg-config

      - name: Verify Docker is available
        run: docker info

      - name: Run Kafka integration tests
        run: |
          cargo test --test integration_containers kafka \
            -- --ignored --test-threads=2

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kafka-test-logs
          path: target/tmp/
          retention-days: 7

  # ── Soroban RPC stub tests ────────────────────────────────────────────────────
  test-soroban:
    name: Soroban RPC stub tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Soroban stub integration tests
        # The stub is fully in-process; no Docker required.
        run: |
          cargo test --test integration_containers soroban \
            -- --ignored --test-threads=8

  # ── Cross-service pipeline tests ─────────────────────────────────────────────
  test-pipeline:
    name: Cross-service pipeline tests
    runs-on: ubuntu-latest
    # All service-specific jobs must pass first.
    needs: [test-postgres, test-redis, test-kafka, test-soroban]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libssl-dev pkg-config

      - name: Verify Docker is available
        run: docker info

      - name: Run cross-service integration tests
        run: |
          cargo test --test integration_containers pipeline \
            -- --ignored --test-threads=2

      - name: Run parallel execution demo test
        run: |
          cargo test --test integration_containers parallel \
            -- --ignored --test-threads=4

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-logs
          path: target/tmp/
          retention-days: 7

  # ── Full integration test suite (sequential, explicit PR gate) ────────────────
  test-all:
    name: Full container test suite
    runs-on: ubuntu-latest
    # Only run on main branch pushes or manual triggers to save CI minutes.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test-postgres, test-redis, test-kafka, test-soroban, test-pipeline]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install librdkafka build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libssl-dev pkg-config

      - name: Verify Docker is available
        run: docker info

      - name: Run full container integration test suite
        run: |
          cargo test --test integration_containers \
            -- --ignored --test-threads=4 \
            ${{ github.event.inputs.test_filter }}

      - name: Upload full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-container-test-results
          path: target/tmp/
          retention-days: 14

  # ── Summary job (acts as a single required-check PR gate) ─────────────────────
  container-tests-ok:
    name: Container tests OK
    runs-on: ubuntu-latest
    needs:
      - test-postgres
      - test-redis
      - test-kafka
      - test-soroban
      - test-pipeline
    if: always()
    steps:
      - name: Check all container test jobs passed
        run: |
          if [[ \
            "${{ needs.test-postgres.result }}"  == "success" && \
            "${{ needs.test-redis.result }}"     == "success" && \
            "${{ needs.test-kafka.result }}"     == "success" && \
            "${{ needs.test-soroban.result }}"   == "success" && \
            "${{ needs.test-pipeline.result }}"  == "success" \
          ]]; then
            echo "✅ All container integration tests passed."
          else
            echo "❌ One or more container tests failed."
            exit 1
          fi
