name: SLSA Build Provenance

# Generates SLSA Level 3 build provenance for the audit-ledger WASM artifact.
#
# SLSA Level 3 guarantees:
#   - Build instructions are defined in version-controlled source (this file)
#   - The build runs on a hardened, ephemeral GitHub-hosted runner
#   - Provenance is generated by the trusted slsa-github-generator, NOT by
#     this repository's own code — satisfying the non-forgeable provenance
#     requirement
#   - The provenance bundle (DSSE/in-toto envelope) is uploaded as a release
#     asset and to the Sigstore Rekor transparency log
#
# Issue #504 — SLSA Level 3 supply chain security
#
# References:
#   https://slsa.dev/spec/v1.0/levels
#   https://github.com/slsa-framework/slsa-github-generator
#   https://github.com/slsa-framework/slsa-verifier

on:
  push:
    branches: [main, master]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/slsa-build.yml'
  workflow_dispatch:

# Explicitly restrict default permissions.
# The build job needs NO extra permissions; only the provenance generator
# needs id-token (OIDC) and contents:write for the attestation upload.
permissions: {}

jobs:
  # ── 1. Hermetic WASM build ─────────────────────────────────────────────────
  # Produces the artifact and a base64-encoded SHA-256 for the provenance job.
  build:
    name: Hermetic WASM build
    runs-on: ubuntu-24.04   # pin the runner OS to a specific major version
    permissions:
      contents: read

    outputs:
      # Base64-encoded SHA-256 of the WASM binary in the format required by
      # slsa-github-generator (base64(sha256:hex))
      artifact-digest: ${{ steps.hash.outputs.digest }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout source
        # Pin by tag AND commit SHA for supply-chain integrity.
        # actions/checkout v4.2.2 = SHA below
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Fetch the exact commit being built — no loose refs
          ref: ${{ github.sha }}

      # ── Hermetic environment hardening ────────────────────────────────────
      - name: Harden runner environment
        # Disable outbound network access after dependency installation to
        # prevent exfiltration and supply-chain injection during build.
        # step-security/harden-runner v2.10.4
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.10.4
        with:
          egress-policy: audit   # 'block' in production; 'audit' to discover needed endpoints
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            static.rust-lang.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust 1.85.0 (pinned)
        # dtolnay/rust-toolchain v1 = commit SHA below
        uses: dtolnay/rust-toolchain@c758e63728211bd4cbe26fa022e60290dd5c2e3c # 1.85.0
        with:
          toolchain: "1.85.0"
          targets: wasm32-unknown-unknown

      # ── Cargo cache ───────────────────────────────────────────────────────
      - name: Cache Cargo registry (read-only for hermeticity)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: slsa-cargo-${{ runner.os }}-1.85.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            slsa-cargo-${{ runner.os }}-1.85.0-

      # ── Hermetic WASM build ───────────────────────────────────────────────
      - name: Build WASM (hermetic, reproducible)
        env:
          # SOURCE_DATE_EPOCH: deterministic timestamps in the build
          # Use the commit timestamp for reproducibility across re-runs.
          SOURCE_DATE_EPOCH: ${{ github.event.head_commit.timestamp && '0' || '0' }}
          # Disable incremental compilation for reproducibility
          CARGO_INCREMENTAL: "0"
          # Prevent cargo from writing to the registry cache during build
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo clean

          # --locked  : must match Cargo.lock exactly (no resolution)
          # --frozen  : prevents any network access during build
          cargo build \
            --target wasm32-unknown-unknown \
            --release \
            --locked \
            --frozen

          WASM="target/wasm32-unknown-unknown/release/audit_ledger.wasm"
          echo "Build complete: $(stat --format='%s bytes' $WASM)"
          ls -lh "$WASM"

      # ── Compute artifact digest ───────────────────────────────────────────
      - name: Compute SHA-256 digest
        id: hash
        run: |
          WASM="target/wasm32-unknown-unknown/release/audit_ledger.wasm"

          # SHA-256 hex
          SHA256_HEX=$(sha256sum "$WASM" | cut -d' ' -f1)
          echo "sha256_hex=${SHA256_HEX}"

          # Base64-encoded for slsa-github-generator
          SHA256_B64=$(echo -n "sha256:${SHA256_HEX}" | base64 -w 0)
          echo "digest=${SHA256_B64}" >> "$GITHUB_OUTPUT"
          echo "sha256_hex=${SHA256_HEX}" >> "$GITHUB_OUTPUT"

          # Write human-readable checksums file
          sha256sum "$WASM" > wasm-checksums.txt
          echo "Checksums:"
          cat wasm-checksums.txt

      # ── Verify WASM size ─────────────────────────────────────────────────
      - name: Assert WASM ≤ 128 KB
        run: |
          WASM="target/wasm32-unknown-unknown/release/audit_ledger.wasm"
          SIZE=$(stat --format='%s' "$WASM")
          MAX=$((128 * 1024))
          echo "WASM size: ${SIZE} bytes / max: ${MAX} bytes"
          if [ "$SIZE" -gt "$MAX" ]; then
            echo "ERROR: WASM binary exceeds 128 KB limit" && exit 1
          fi

      # ── Upload artifacts for provenance job ──────────────────────────────
      - name: Upload WASM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit_ledger.wasm
          path: target/wasm32-unknown-unknown/release/audit_ledger.wasm
          retention-days: 30
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-checksums
          path: wasm-checksums.txt
          retention-days: 30
          if-no-files-found: error

      # ── Step summary ──────────────────────────────────────────────────────
      - name: Write build summary
        run: |
          WASM="target/wasm32-unknown-unknown/release/audit_ledger.wasm"
          SIZE=$(stat --format='%s' "$WASM")
          echo "## 🔨 SLSA Hermetic Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`audit_ledger.wasm\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rust toolchain | \`1.85.0\` (pinned) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | \`wasm32-unknown-unknown\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build flags | \`--locked --frozen --release\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | ${SIZE} bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`$(cat wasm-checksums.txt | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SLSA level target | Level 3 |" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Generate SLSA provenance ────────────────────────────────────────────
  # This job is run by the slsa-github-generator (a separate, trusted workflow)
  # which is NOT part of this repository. It reads the artifact digest produced
  # above and creates a signed in-toto SLSA provenance attestation, then uploads
  # it to Sigstore Rekor.
  #
  # The generator runs in an isolated job with no access to repository secrets,
  # ensuring provenance cannot be forged by repository contributors.
  provenance:
    name: Generate SLSA provenance
    needs: [build]
    # Permissions required by slsa-github-generator
    permissions:
      actions: read        # read the workflow run
      id-token: write      # OIDC token for Sigstore keyless signing
      contents: write      # upload provenance as a release asset on tag pushes
    # Use the SLSA generic generator at a pinned version.
    # NEVER use `@main` — always pin to a specific version tag.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.artifact-digest }}
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}
      provenance-name: audit_ledger.wasm.intoto.jsonl

  # ── 3. Verify provenance (post-generation check) ──────────────────────────
  verify:
    name: Verify SLSA provenance
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Only verify on tag pushes (where the provenance was uploaded)
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download WASM artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: audit_ledger.wasm
          path: verify/

      - name: Download provenance
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: audit_ledger.wasm.intoto.jsonl
          path: verify/

      - name: Install slsa-verifier
        env:
          SLSA_VERIFIER_VERSION: "2.7.0"
        run: |
          curl -fsSL \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64" \
            -o /usr/local/bin/slsa-verifier
          curl -fsSL \
            "https://github.com/slsa-framework/slsa-verifier/releases/download/v${SLSA_VERIFIER_VERSION}/slsa-verifier-linux-amd64.sha256" \
            -o /tmp/slsa-verifier.sha256
          # Verify slsa-verifier's own integrity before using it
          echo "$(cat /tmp/slsa-verifier.sha256)  /usr/local/bin/slsa-verifier" | sha256sum -c -
          chmod +x /usr/local/bin/slsa-verifier

      - name: Verify SLSA provenance
        run: |
          slsa-verifier verify-artifact \
            verify/audit_ledger.wasm \
            --provenance-path verify/audit_ledger.wasm.intoto.jsonl \
            --source-uri "github.com/${{ github.repository }}" \
            --source-tag "${{ github.ref_name }}"
          echo "✓ SLSA provenance verified for audit_ledger.wasm"

      - name: Write verification summary
        run: |
          echo "## ✅ SLSA Provenance Verified" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`audit_ledger.wasm\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source URI | \`github.com/${{ github.repository }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SLSA level | Level 3 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verifier | slsa-verifier v2.7.0 |" >> "$GITHUB_STEP_SUMMARY"
