name: API Contract Testing with Pact

on:
  push:
    branches: [ master, main ]
    paths:
      - 'api/**'
      - 'tests/contract-testing/**'
      - 'sdk/**'
      - 'ui/**'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'api/**'
      - 'tests/contract-testing/**'
      - 'sdk/**'
      - 'ui/**'
  workflow_dispatch:

jobs:
  consumer-contract-tests:
    name: Pact Consumer Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'tests/contract-testing/package.json'

      - name: Install dependencies
        working-directory: tests/contract-testing
        run: |
          npm install

      - name: Run Consumer Contract Tests
        working-directory: tests/contract-testing
        run: |
          npm run test:consumers

      - name: Upload Pact Contracts
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: tests/contract-testing/pacts/
          retention-days: 30

  provider-verification:
    name: Pact Provider Contract Verification
    runs-on: ubuntu-latest
    needs: consumer-contract-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'tests/contract-testing/package.json'

      - name: Install dependencies
        working-directory: tests/contract-testing
        run: |
          npm install

      - name: Download Pact Contracts
        uses: actions/download-artifact@v4
        with:
          name: pact-contracts
          path: tests/contract-testing/pacts/

      - name: Run Provider Verification Tests
        working-directory: tests/contract-testing
        run: |
          npm run test:provider

      - name: Check Can-I-Deploy Matrix Gate
        working-directory: tests/contract-testing
        run: |
          npm run pact:can-i-deploy
