frameworks:
  - id: "SOC2"
    name: "AICPA SOC 2 Type II"
    description: "Trust Services Criteria for Security, Availability, and Processing Integrity"
    controls:
      - rule_id: "SEC-001"
        clause: "CC6.1 / CC6.3"
        name: "Multi-Signature Governance Quorum"
      - rule_id: "SEC-002"
        clause: "CC6.6 / CC7.1"
        name: "Cryptographic State Hash Linkage"
      - rule_id: "DR-002"
        clause: "CC6.5"
        name: "Legal Hold Protection Against Unauthorized Deletion"

  - id: "ISO27001"
    name: "ISO/IEC 27001:2022"
    description: "Information Security Management System Controls"
    controls:
      - rule_id: "AC-001"
        clause: "A.5.15 / ISO 37001"
        name: "Anti-Bribery and Officer Assignment"
      - rule_id: "SEC-001"
        clause: "A.9.4"
        name: "Access Control for Privileged Utility Programs"
      - rule_id: "SEC-002"
        clause: "A.10.1"
        name: "Cryptographic Controls and State Attestation"

  - id: "GDPR"
    name: "EU General Data Protection Regulation 2016/679"
    description: "Data Protection and Privacy Principles"
    controls:
      - rule_id: "DR-001"
        clause: "Article 17"
        name: "Right to Erasure (Forgotten) SLA"
      - rule_id: "DR-003"
        clause: "Article 5(1)(e)"
        name: "Storage Limitation and Retention Horizon"

  - id: "MICA"
    name: "EU Markets in Crypto-Assets Regulation (EU) 2023/1114"
    description: "Regulatory Framework for Crypto-Asset Issuance and Trading"
    controls:
      - rule_id: "FIN-001"
        clause: "Article 36(1) / Article 38"
        name: "100% Minimum Reserve Asset Backing"
      - rule_id: "FIN-002"
        clause: "EU TFR / MiCA Title III"
        name: "Transfer Identification Requirements"

  - id: "FATF_FINCEN"
    name: "FATF Recommendations & FinCEN Bank Secrecy Act"
    description: "Anti-Money Laundering and Counter-Terrorist Financing"
    controls:
      - rule_id: "FIN-002"
        clause: "FATF Recommendation 16"
        name: "Travel Rule Originator/Beneficiary Identification"
      - rule_id: "FIN-003"
        clause: "FinCEN 31 CFR 1010.311"
        name: "Large Currency Transaction Reporting (>=$10,000)"

  - id: "TRADE_EXPORT"
    name: "WTO Rules of Origin & US EAR/ITAR Export Controls"
    description: "Cross-Border Trade Compliance and Sanctions Screening"
    controls:
      - rule_id: "EC-001"
        clause: "EAR / OFAC SDN"
        name: "Denied Party List Screening"
      - rule_id: "EC-002"
        clause: "ITAR / EAR Dual-Use"
        name: "Dual-Use Commodity Export License Verification"
      - rule_id: "EC-003"
        clause: "UN / OFAC Sanctions"
        name: "Comprehensive Embargo Jurisdiction Restrictions"
      - rule_id: "TC-001"
        clause: "WTO / WCO SAFE"
        name: "Certificate of Origin Authentication"
      - rule_id: "TC-002"
        clause: "WCO Harmonized System"
        name: "Harmonized System Tariff Classification"
      - rule_id: "TC-003"
        clause: "GATT Art. VII"
        name: "Customs Valuation & Anti-Dumping Benchmarks"
