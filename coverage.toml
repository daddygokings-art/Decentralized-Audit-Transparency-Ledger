# Coverage configuration for the Decentralized Audit & Transparency Ledger
# Used by scripts/coverage.sh and scripts/check_coverage_thresholds.py
# Issue #495 — contract event test coverage reporting with thresholds

# ── Global defaults ────────────────────────────────────────────────────────────
[global]
# Minimum line coverage percentage required across the entire crate (0–100).
line_threshold = 60.0

# Minimum branch coverage percentage required across the entire crate (0–100).
# Set to 0 to disable branch enforcement globally.
branch_threshold = 0.0

# Fail the coverage check if the overall line coverage drops below this value.
# This acts as a hard floor regardless of per-module settings.
hard_floor = 50.0

# Number of historical trend data-points to keep in coverage-trend.json.
trend_history_limit = 30

# ── Exclusion rules ────────────────────────────────────────────────────────────
# Patterns matched against file paths (relative to the crate root).
# Any file whose path contains one of these strings is excluded from coverage.
[exclusions]
files = [
    # Fuzz-harness entry points — not intended to be exercised by unit tests
    "src/fuzz.rs",
    "src/comprehensive_fuzz.rs",

    # Pure benchmark harness
    "src/bench.rs",

    # Property-based test drivers (proptest strategy declarations)
    "src/proptest.rs",

    # Test modules — we measure *production* code coverage only
    "src/test.rs",
    "src/supply_chain_tests.rs",
    "src/stablecoin_reserves_tests.rs",
    "src/defi_auditing_tests.rs",
    "src/carbon_credits_tests.rs",
    "src/esg_reporting_tests.rs",
    "src/regulatory_reporting_tests.rs",
    "src/tax_tests.rs",
    "src/regulator_tests.rs",
    "src/boundary_tests.rs",
    "src/fee_tests.rs",
    "src/chaos_tests.rs",
    "src/concurrent_tests.rs",
    "src/security_tests.rs",
    "src/cross_contract_tests.rs",
    "src/regression_tests.rs",
    "src/upgrade_tests.rs",
    "src/sandbox_tests.rs",
    "src/asset_lifecycle_tests.rs",
    "src/dao_governance_tests.rs",
    "src/nft_provenance_tests.rs",
    "src/digital_passport_tests.rs",
    "src/cbdc_tests.rs",
    "src/token_gating_tests.rs",
    "src/suptech_tests.rs",
    "src/data_retention_tests.rs",
    "src/anti_corruption/tests.rs",
    "src/export_controls/tests.rs",
    "src/responsible_sourcing/tests.rs",
    "src/trade_compliance/tests.rs",

    # Integration tests live outside src/
    "tests/",
]

# Regex patterns matched against function names to exclude individual functions.
# Primarily used to skip trivial derives and generated impls.
functions = [
    # Soroban-generated contract dispatch stubs
    "__call",
    "spec_xdr",
    # Rust auto-derives
    "fmt",
    "clone",
    "eq",
    "partial_eq",
    "hash",
]

# ── Per-module thresholds ──────────────────────────────────────────────────────
# Each [[module]] entry applies to a source file path prefix.
# The FIRST matching entry wins (most specific first).
# `line` and `branch` are percentages (0–100); omit to inherit the global default.

