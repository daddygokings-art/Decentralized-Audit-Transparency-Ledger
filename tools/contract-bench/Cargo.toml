[package]
name = "contract-bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Gas, storage, memory and WASM-size benchmark suite for the AuditLedger contract, with regression detection"

# Deliberately independent of the `audit-ledger` crate.
#
# A benchmark suite that lives inside the contract crate cannot be run when the
# contract does not build, and a benchmark of the contract is worth little if it
# shares a compilation unit with it: a refactor that changes how the contract
# compiles can silently change what is being measured. This crate depends on
# `soroban-sdk` and nothing else, so the harness stays measurable independently
# of the contract's own build health. `src/contract.rs` holds the operation model
# transcribed from the contract source, and the switch to execute the real
# contract lives behind a feature flag that is off until the contract compiles.

[dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "contract_bench"
path = "src/lib.rs"

[[bin]]
name = "audit-ledger-bench"
path = "src/main.rs"

# Custom harnesses, not libtest.
#
# libtest measures wall-clock time, which is the wrong metric here: run-to-run
# variance on a shared CI runner routinely exceeds 5%, so a wall-clock gate at the
# 5% threshold this suite is required to use would fail at random and get muted.
# The quantities that actually matter for a contract are metered by the host and
# are deterministic: instruction counts, memory bytes, ledger entries read and
# written. So each benchmark runs a fixed workload, reads the host's own metering
# back, and reports it. Repeated runs of the same scenario return identical
# numbers, which is what makes a 5% regression threshold both meaningful and
# stable.
[[bench]]
name = "scenarios"
harness = false

[[bench]]
name = "functions"
harness = false

[[bench]]
name = "storage"
harness = false

[profile.bench]
debug = 0
