# Requires kube-prometheus-stack with kube-state-metrics (standard in the
# chart) — no custom instrumentation needed, since Kubernetes Job status
# already tells us whether a rotation ran and succeeded.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: audit-ledger-secrets-rotation
  namespace: audit-ledger-secrets
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: secrets-rotation
      rules:
        - alert: SecretRotationJobFailed
          expr: kube_job_status_failed{namespace="audit-ledger-secrets", job_name=~"rotate-.*"} > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Secrets rotation job {{ $labels.job_name }} failed"
            description: "A secrets-rotation CronJob run failed — validate-rotation.sh either caught a bad rotation and triggered rollback-rotation.sh, or the job errored before completing. Treat as a page: a failed rotation may mean the currently-active credential is past its intended lifetime."

        - alert: DatabaseCredentialRotationOverdue
          expr: (time() - audit_ledger_last_rotation_timestamp_seconds{target=~"db-.*"}) / 86400 > 10
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Database credential '{{ $labels.target }}' rotation is overdue"
            description: "Expected weekly rotation; no successful rotation recorded in over 10 days."

        - alert: SigningKeyRotationOverdue
          expr: (time() - audit_ledger_last_rotation_timestamp_seconds{target=~"signing-key-.*"}) / 86400 > 45
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Signing key '{{ $labels.target }}' rotation is overdue"
            description: "Expected 30-day rotation; no successful rotation recorded in over 45 days."

        - alert: APIKeyRotationOverdue
          expr: (time() - audit_ledger_last_rotation_timestamp_seconds{target=~"api-key-.*"}) / 86400 > 120
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "API key '{{ $labels.target }}' rotation is overdue"
            description: "Expected 90-day rotation; no successful rotation recorded in over 120 days."

        - alert: VaultSealed
          expr: vault_core_unsealed == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Vault instance {{ $labels.instance }} is sealed"
            description: "A sealed Vault cannot serve secrets or perform rotations — all dependent CronJobs will fail until unsealed (auto-unseal should recover this without action; page if it doesn't clear within 5m)."

# Note: audit_ledger_last_rotation_timestamp_seconds is emitted by
# scripts/secrets-rotation/common.sh's record_rotation_state() via a
# node_exporter textfile-collector drop (see docs/security/secrets-rotation.md
# "Metrics" section) rather than scraped directly from Vault, since Vault
# itself has no concept of "our" rotation cadence per secret class.
