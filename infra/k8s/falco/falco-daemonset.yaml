apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: audit-ledger-security
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/part-of: audit-ledger
    app.kubernetes.io/component: runtime-security
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
      app.kubernetes.io/part-of: audit-ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        app.kubernetes.io/part-of: audit-ledger
        app.kubernetes.io/component: runtime-security
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8765"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: falco
      hostPID: true
      hostIPC: true
      hostNetwork: true
      tolerations:
        # Run on control-plane nodes as well as workers so audit events from
        # the API server are captured.
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
        - key: CriticalAddonsOnly
          operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        privileged: true
      containers:
        - name: falco
          image: falcosecurity/falco:0.41.1
          imagePullPolicy: IfNotPresent
          args:
            - /usr/bin/falco
            - --config-file=/etc/falco/falco.yaml
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
                - SYS_PTRACE
                - SYS_RESOURCE
                - IPC_LOCK
                - NET_ADMIN
                - NET_RAW
                - AUDIT_CONTROL
                - AUDIT_READ
                - DAC_READ_SEARCH
            readOnlyRootFilesystem: true
          ports:
            - name: metrics
              containerPort: 8765
              protocol: TCP
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: boot
              mountPath: /host/boot
              readOnly: true
            - name: modules
              mountPath: /host/lib/modules
              readOnly: true
            - name: usr
              mountPath: /host/usr
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
            - name: rules-config
              mountPath: /etc/falco/rules.d
              readOnly: true
            - name: falco-config
              mountPath: /etc/falco/falco.yaml
              subPath: falco.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: boot
          hostPath:
            path: /boot
        - name: modules
          hostPath:
            path: /lib/modules
        - name: usr
          hostPath:
            path: /usr
        - name: sys
          hostPath:
            path: /sys
        - name: etc
          hostPath:
            path: /etc
        - name: rules-config
          configMap:
            name: falco-rules
        - name: falco-config
          configMap:
            name: falco-config
