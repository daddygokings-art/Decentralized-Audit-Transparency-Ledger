apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: security@audit-ledger.example
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
        selector:
          dnsZones:
            - "audit-ledger.example"
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: REPLACE_ME
        selector:
          dnsZones:
            - "internal.audit-ledger.example"
