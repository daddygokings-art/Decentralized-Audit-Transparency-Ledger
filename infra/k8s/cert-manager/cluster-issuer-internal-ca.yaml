# Custom issuer for internal mTLS (service-to-service, Vault's own
# listener cert, Prometheus scrape TLS) — backed by Vault's PKI secrets
# engine rather than a public CA, since these names are never
# internet-facing and a public CA would refuse to issue for them anyway.
#
# Prerequisite (run once against Vault):
#   vault secrets enable pki
#   vault secrets tune -max-lease-ttl=87600h pki
#   vault write pki/root/generate/internal \
#     common_name="audit-ledger internal CA" ttl=87600h
#   vault write pki/roles/internal-mtls \
#     allowed_domains="svc.cluster.local,audit-ledger-secrets,audit-ledger-certs,audit-ledger" \
#     allow_subdomains=true max_ttl=2160h
#   vault policy write cert-manager-pki infra/k8s/cert-manager/vault-pki-policy.hcl
#   vault write auth/kubernetes/role/cert-manager \
#     bound_service_account_names=cert-manager \
#     bound_service_account_namespaces=audit-ledger-certs \
#     policies=cert-manager-pki ttl=20m
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-vault
spec:
  vault:
    server: https://vault.audit-ledger-secrets.svc:8200
    path: pki/sign/internal-mtls
    caBundleSecretRef:
      name: vault-ca-bundle
      key: ca.crt
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager
