apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: audit-ledger
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-core
  namespace: audit-ledger
spec:
  podSelector:
    matchLabels:
      app: audit-ledger-api
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingress-gateway
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: vault
      ports:
        - protocol: TCP
          port: 8200
    - to:
        - podSelector:
            matchLabels:
              app: soroban-rpc
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-vault-and-consensus
  namespace: audit-ledger
spec:
  podSelector:
    matchLabels:
      app: vault
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: audit-ledger-api
        - podSelector:
            matchLabels:
              app: notifier-service
      ports:
        - protocol: TCP
          port: 8200
  egress: []
