apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-manager
  namespace: audit-ledger
  labels:
    app.kubernetes.io/name: incident-manager
    app.kubernetes.io/component: monitoring
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-manager
    spec:
      containers:
        - name: incident-manager
          image: audit-ledger/incident-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3008
              name: http
          env:
            - name: PORT
              value: "3008"
            - name: PAGERDUTY_ROUTING_KEY
              valueFrom:
                secretKeyRef:
                  name: incident-secrets
                  key: pagerduty-routing-key
                  optional: true
            - name: OPSGENIE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: incident-secrets
                  key: opsgenie-api-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3008
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3008
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: incident-manager-svc
  namespace: audit-ledger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: incident-manager
  ports:
    - name: http
      port: 80
      targetPort: 3008
