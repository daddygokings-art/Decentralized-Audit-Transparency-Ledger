apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-ledger-primary-us-east
  namespace: audit-ledger
  labels:
    app.kubernetes.io/name: audit-ledger
    topology.kubernetes.io/region: us-east-1
    role: primary
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-ledger
      topology.kubernetes.io/region: us-east-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-ledger
        topology.kubernetes.io/region: us-east-1
        role: primary
    spec:
      containers:
        - name: relayer-engine
          image: audit-ledger/bridge-relayer:latest
          env:
            - name: REGION
              value: "us-east-1"
            - name: IS_PRIMARY
              value: "true"
            - name: PEER_REGIONS
              value: "eu-central-1,ap-southeast-1"
          ports:
            - containerPort: 3000
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: audit-ledger-us-east-svc
  namespace: audit-ledger
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: audit-ledger
    topology.kubernetes.io/region: us-east-1
  ports:
    - name: http
      port: 80
      targetPort: 3000
