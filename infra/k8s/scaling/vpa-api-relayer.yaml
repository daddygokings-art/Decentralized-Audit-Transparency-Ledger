apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-relayer-vpa
  namespace: audit-ledger
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bridge-relayer
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: "100m"
          memory: "128Mi"
        maxAllowed:
          cpu: "2000m"
          memory: "2048Mi"
        controlledResources: ["cpu", "memory"]
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: rest-api-vpa
  namespace: audit-ledger
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rest-api
  updatePolicy:
    updateMode: "Initial"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: "150m"
          memory: "256Mi"
        maxAllowed:
          cpu: "4000m"
          memory: "4096Mi"
