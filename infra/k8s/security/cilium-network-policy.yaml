apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: audit-ledger-zero-trust
  namespace: audit-ledger
  labels:
    app.kubernetes.io/part-of: audit-ledger
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: audit-ledger
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/part-of: audit-ledger
      toPorts:
        - ports:
            - port: "3002"
              protocol: TCP
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
  authentication:
    mode: required