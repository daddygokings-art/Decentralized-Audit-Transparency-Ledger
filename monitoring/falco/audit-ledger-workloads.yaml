## Deployment

All manifests live in `infra/k8s/falco/` and are applied with kustomize:

```bash
kubectl apply -k infra/k8s/falco/
```

This installs into the `audit-ledger-security` namespace:

| Manifest | Purpose |
| --- | --- |
| `namespace.yaml` | Dedicated `audit-ledger-security` namespace |
| `rbac.yaml` | ServiceAccount + ClusterRole(Binding) for Falco |
| `falco-daemonset.yaml` | Falco daemonset exposing native /metrics on port 8765 |
| `falco-service.yaml` | Prometheus scrape target on port 8765 |
| `falco-rules` (ConfigMap) | Custom contract rules generated from `monitoring/falco/rules.d/` |
| `falco-config` (ConfigMap) | Falco engine configuration |
| `falco-prometheusrule.yaml` | PrometheusRule CRDs for runtime-security alerts |
| `alertmanager-config.yaml` | Routes security alerts to the incident-response receiver |
| `incident-response.yaml` | Incident receiver deployment + service |

## Custom Falco Rules

Canonical contract-specific rules are maintained in:

```
monitoring/falco/rules.d/audit-ledger-workloads.yaml
```

These are bundled into the `falco-rules` ConfigMap via `configMapGenerator`
(see `infra/k8s/falco/kustomization.yaml`), so the daemonset mounts
`/etc/falco/rules.d/audit-ledger-workloads.yaml` and reloads on change.

Rules cover contract-specific threats:

- `audit_ledger_shell_spawn` — unexpected shells in contract containers.
- `audit_ledger_sensitive_file_access` — access to credentials/keys.
- `audit_ledger_unusual_network_connection` — outbound egress to non-private IPs.
- `audit_ledger_privilege_escalation` — su/sudo/setpriv/unshare/nsenter.
- `audit_ledger_crypto_miner` — known miner binaries.
- `audit_ledger_package_manager` — package managers run at runtime.
- `audit_ledger_container_escape` — host filesystem mounts.
- `audit_ledger_sensitive_env_access` — secrets passed on the command line.
- `audit_ledger_reverse_shell` — exfiltration / reverse-shell patterns.
- `audit_ledger_sensitive_mount_write` — writes to keystore/signing paths.
- `audit_ledger_foreign_binary_exec` — binaries not part of the image.

## Alerting

`falco-prometheusrule.yaml` defines `PrometheusRule` CRDs (require a Prometheus
Operator) that fire on Falco's native rule-match metrics (`falcosecurity_falco_rules_matches_total`):

- **Critical** — privilege escalation, crypto mining, container escape, reverse
  shell, foreign binary exec, signing-key tampering.
- **Warning** — sensitive file/env access, unusual network egress, shell spawn.
- **Availability guard** — `AuditLedgerFalcoSilence` fires if Falco goes quiet.

`alertmanager-config.yaml` routes critical events to the `incident-response`
webhook so the on-call rotation is paged immediately.

## Incident Response

`incident-response.yaml` deploys an in-cluster receiver (see
`services/incident-response/`). Alertmanager posts security-critical events to
`/incidents`; the receiver logs each incident and forwards it to external
incident tooling (Slack / PagerDuty / generic webhook) configured via the
`INCIDENT_FORWARD_URL` environment variable.

## Verification

```bash
# Validate the rules file with a local falco binary (dev machine only)
falco -r monitoring/falco/rules.d/audit-ledger-workloads.yaml --list

# Render the kustomize output
kubectl kustomize infra/k8s/falco/

# Apply to the cluster
kubectl apply -k infra/k8s/falco/

# Confirm daemonset is running on every node
kubectl -n audit-ledger-security get daemonset falco

# Check that custom rules were loaded (rules are listed at startup)
kubectl -n audit-ledger-security logs daemonset/falco | grep -i "audit_ledger"

# Scrape Falco native metrics
kubectl -n audit-ledger-security port-forward svc/falco 8765:8765
curl localhost:8765/metrics | grep falcosecurity_falco_rules_matches_total
```

