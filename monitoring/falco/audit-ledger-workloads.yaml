# Runtime Security Monitoring

## Overview

This document describes the runtime security monitoring setup for the AuditLedger stack using Falco for Kubernetes. Runtime security detects and alerts on anomalous behavior that static analysis and SAST tools cannot catch, such as post-exploitation shells, privilege escalation, crypto mining, container escape and signing-key tampering.

