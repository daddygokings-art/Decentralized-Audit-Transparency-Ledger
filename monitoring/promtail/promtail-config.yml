server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: audit-ledger-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            trace_id: trace_id
            span_id: span_id
            contract_id: contract_id
            event_type: event_type
            message: message
      - labels:
          service:
          level:
          contract_id:
          event_type:
