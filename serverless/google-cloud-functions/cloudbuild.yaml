steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - functions
      - deploy
      - processContractEvent
      - --gen2
      - --runtime=nodejs20
      - --region=us-central1
      - --source=serverless/google-cloud-functions
      - --entry-point=processContractEventHttp
      - --trigger-http
      - --allow-unauthenticated
