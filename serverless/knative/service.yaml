apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: audit-ledger-event-processor
  namespace: audit-ledger
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "50"
        autoscaling.knative.dev/target: "100"
    spec:
      containers:
        - image: gcr.io/audit-ledger/serverless-processor:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
